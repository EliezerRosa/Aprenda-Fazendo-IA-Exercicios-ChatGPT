  <script>
    let currentTab = 'html';

    function switchTab(tab) {
      // Remove active class from all editors and tabs
      document.querySelectorAll('.editor').forEach(editor => {
        editor.classList.remove('active');
      });
      document.querySelectorAll('.tab').forEach(tabBtn => {
        tabBtn.classList.remove('active');
      });
      
      // Show selected editor and activate tab
      document.getElementById(tab + 'Editor').classList.add('active');
      event.target.classList.add('active');
      
      currentTab = tab;
    }

    function updatePreview() {
      const html = document.getElementById('htmlEditor').value;
      const css = document.getElementById('cssEditor').value;
      const js = document.getElementById('jsEditor').value;
      
      const preview = document.getElementById('preview');
      const previewDoc = preview.contentDocument || preview.contentWindow.document;
      
      // Create complete HTML with CSS and JS
      let fullHTML = html;
      
      // Insert CSS
      if (css.trim()) {
        fullHTML = fullHTML.replace('</head>', `<style>${css}</style></head>`);
      }
      
      // Insert JS
      if (js.trim()) {
        fullHTML = fullHTML.replace('</body>', `<script>${js}<\/script></body>`);
      }
      
      previewDoc.open();
      previewDoc.write(fullHTML);
      previewDoc.close();
    }

          js: `let randomNumber;
let attempts;
let guessHistory;

function newGame() {
  randomNumber = Math.floor(Math.random() * 100) + 1;
  attempts = 0;
  guessHistory = [];
  
  document.getElementById('message').textContent = 'Novo jogo iniciado! Boa sorte!';
  document.getElementById('attempts').textContent = '';
  document.getElementById('history').textContent = '';
  document.getElementById('guess').value = '';
  document.getElementById('guess').focus();
}

function checkGuess() {
  const guess = parseInt(document.getElementById('guess').value);
  const messageEl = document.getElementById('message');
  const attemptsEl = document.getElementById('attempts');
  const historyEl = document.getElementById('history');
  
  if (!guess || guess < 1 || guess > 100) {
    messageEl.textContent = 'Por favor, digite um número entre 1 e 100!';
    return;
  }
  
  attempts++;
  guessHistory.push(guess);
  
  if (guess === randomNumber) {
    messageEl.innerHTML = '🎉 Parabéns! Você acertou em ' + attempts + ' tentativa(s)!';
    messageEl.style.color = '#4ecdc4';
  } else if (guess < randomNumber) {
    messageEl.textContent = '📈 Muito baixo! Tente um número maior.';
    messageEl.style.color = '#ffeaa7';
  } else {
    messageEl.textContent = '📉 Muito alto! Tente um número menor.';
    messageEl.style.color = '#fd79a8';
  }
  
  attemptsEl.textContent = 'Tentativas: ' + attempts;
  historyEl.innerHTML = '<strong>Seus palpites:</strong> ' + guessHistory.join(', ');
  
  document.getElementById('guess').value = '';
  document.getElementById('guess').focus();
}

// Permitir tecla Enter para jogar
document.getElementById('guess').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') {
    checkGuess();
  }
});

// Iniciar novo jogo quando a página carrega
newGame();`
